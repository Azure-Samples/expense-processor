name: functions-hosted-skill-expense-processor
metadata:
  template: functions-hosted-skill-expense-processor@1.0.0
services:
  api:
    resourceGroup: ${EXPENSE_PROCESSOR_RESOURCE_GROUP}
    project: ./src
    language: python
    host: function
    hooks:
      # Generate src/requirements.txt from src/pyproject.toml + src/uv.lock right before
      # packaging, so the Functions remote build (Oryx) has one while deps stay defined in
      # pyproject.toml. The file is gitignored — uv is the single source of truth.
      prepackage:
        posix:
          shell: sh
          continueOnError: false
          run: uv export --format requirements-txt --no-hashes --no-dev --no-emit-project -o requirements.txt
        windows:
          shell: pwsh
          continueOnError: false
          run: uv export --format requirements-txt --no-hashes --no-dev --no-emit-project -o requirements.txt
  mcp:
    resourceGroup: ${EXPENSE_MCP_RESOURCE_GROUP}
    project: ./mcp-server
    language: python
    host: function
    hooks:
      prepackage:
        posix:
          shell: sh
          continueOnError: false
          run: uv export --format requirements-txt --no-hashes --no-dev --no-emit-project -o requirements.txt
        windows:
          shell: pwsh
          continueOnError: false
          run: uv export --format requirements-txt --no-hashes --no-dev --no-emit-project -o requirements.txt
# Seed policies with the Azure SDK. Demo messages are submitted manually so a fresh
# deployment starts with empty queues. DefaultAzureCredential uses the identity
# established by azd, so Azure CLI is not required.
hooks:
  postprovision:
    posix:
      shell: sh
      continueOnError: true
      interactive: false
      run: uv run --project src --no-sync python scripts/setup_demo.py seed-policies
    windows:
      shell: pwsh
      continueOnError: true
      interactive: false
      run: uv run --project src --no-sync python scripts/setup_demo.py seed-policies
